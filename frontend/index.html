<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A personal research folio stored on Cloudflare R2.">
    <title>Folio — Research, bound</title>
    <link rel="icon" href="/folio-mark.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#library">Skip to library</a>

    <main class="deck" id="deck" data-view="0">
      <section class="view view-upload" id="upload-view" aria-labelledby="hero-title" tabindex="-1">
        <button class="page-switch page-switch-folio" id="show-library" type="button">
          <span>Folio</span>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5"/></svg>
        </button>

        <div class="upload-view-inner">
          <header class="hero-copy">
            <h1 id="hero-title">Research, <em>bound.</em></h1>
            <p>A private shelf with public reading links.</p>
          </header>

          <form class="upload-box" id="upload-form">
            <label class="drop-zone" id="drop-zone" for="pdf-file">
              <input id="pdf-file" name="file" type="file" accept="application/pdf,.pdf">
              <svg viewBox="0 0 32 32" aria-hidden="true">
                <path d="M16 22V6m0 0-6 6m6-6 6 6M6 20v6h20v-6"/>
              </svg>
              <span class="drop-title" id="file-name">Choose a PDF</span>
              <span class="drop-note" id="file-note">or drop one here · up to 95 MB</span>
            </label>

            <div class="field-pair">
              <label>
                <span>Title</span>
                <input id="artifact-title" name="title" type="text" maxlength="160" placeholder="A field guide to…" required>
              </label>
              <label>
                <span>Short link</span>
                <span class="slug-field">
                  <span>/a/</span>
                  <input id="artifact-slug" name="slug" type="text" maxlength="80" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="field-guide" required>
                </span>
              </label>
            </div>

            <div class="publish-row">
              <button class="primary-button" type="submit">
                <span>Publish folio</span>
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5"/></svg>
              </button>
            </div>

            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
          </form>
        </div>

      </section>

      <section class="view view-library" id="library" aria-labelledby="library-title" tabindex="-1" hidden>
        <div class="library-shell">
          <div class="library-topline">
            <button class="back-button" id="show-upload" type="button">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H4m5-5-5 5 5 5"/></svg>
              <span>Upload</span>
            </button>

            <dl class="library-stats" aria-label="Library totals">
              <div><dt>Works</dt><dd id="artifact-count">—</dd></div>
              <span aria-hidden="true">·</span>
              <div><dt>Stored</dt><dd id="artifact-size">—</dd></div>
            </dl>
          </div>

          <div class="library-heading">
            <h2 id="library-title">
              <span class="search-word">Search</span>
              <span class="folio-word">Folio</span>
            </h2>
            <div class="search-tools">
              <button class="search-toggle" id="search-toggle" type="button" aria-expanded="false" aria-controls="search-field" aria-label="Search folios">
                <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
              </button>
              <label class="search-field" id="search-field">
                <span class="sr-only">Search folios</span>
                <input id="search" type="search" placeholder="Find a folio">
              </label>
            </div>
          </div>

          <p class="sr-only" id="library-status" role="status" aria-live="polite"></p>
          <div class="folio-list" id="folio-list">
            <div class="loading-row"><p>Reading the shelf…</p></div>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span id="toast-message"></span>
      <button id="copy-link" type="button">Copy link</button>
      <button class="toast-close" id="toast-close" type="button" aria-label="Dismiss">×</button>
    </div>
  </body>
</html>
